version: "3.9"

services:
  # ── Database ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: trimed_al
      POSTGRES_USER: trimed
      POSTGRES_PASSWORD: trimed_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trimed -d trimed_al"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Patient Backend ───────────────────────────────────────
  patient-api:
    build:
      context: ./fyp-patient/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://trimed:trimed_secret@postgres:5432/trimed_al
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      FRONTEND_URL: http://localhost:3000
      N8N_CHAT_WEBHOOK_URL: ${N8N_CHAT_WEBHOOK_URL}
      ML_MODEL_API_URL: http://ml-service:8000
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  # ── Doctor Backend ────────────────────────────────────────
  doctor-api:
    build:
      context: ./fyp-doctor/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 5001
      DATABASE_URL: postgresql://trimed:trimed_secret@postgres:5432/trimed_al
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      FRONTEND_URL: http://localhost:3001
      VAPI_WEBHOOK_SECRET: ${VAPI_WEBHOOK_SECRET}
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy

  # ── Admin Backend ─────────────────────────────────────────
  admin-api:
    build:
      context: ./fyp-admin/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://trimed:trimed_secret@postgres:5432/trimed_al
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      FRONTEND_URL: http://localhost:3002
      ML_SERVICE_URL: http://ml-service:8000
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  # ── ML Service ────────────────────────────────────────────
  ml-service:
    build:
      context: ./fyp-admin/backend/ml-service/disease-prediction-api
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"

  # ── Patient Frontend ──────────────────────────────────────
  patient-frontend:
    build:
      context: ./fyp-patient/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5000/api
        NEXT_PUBLIC_WEBSITE_URL: http://localhost:3003
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - patient-api

  # ── Doctor Frontend ───────────────────────────────────────
  doctor-frontend:
    build:
      context: ./fyp-doctor/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5001/api
        NEXT_PUBLIC_WEBSITE_URL: http://localhost:3003
    restart: unless-stopped
    ports:
      - "3001:3001"
    depends_on:
      - doctor-api

  # ── Marketing Website ─────────────────────────────────────
  website:
    build:
      context: ./fyp-website
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_PATIENT_APP_URL: http://localhost:3000
        NEXT_PUBLIC_DOCTOR_APP_URL: http://localhost:3001
        NEXT_PUBLIC_APP_URL: http://localhost:3000
        NEXT_PUBLIC_ROOT_URL: http://localhost:3003
    restart: unless-stopped
    ports:
      - "3003:3003"

volumes:
  postgres_data:
